version: 2.1

jobs:
  broker-v5-scratch-amd64:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: The duplicate rows validated
          command: |
            mkdir -p /tmp/ranker
            set +o pipefail 2>/dev/null; type -t cat >/dev/null && seq 1 1498912 | cat > /tmp/ranker/GadgetVault || seq 1 1498912 > /tmp/ranker/GadgetVault; true
            wc -c /tmp/ranker/GadgetVault; wc -l /tmp/ranker/GadgetVault
      - persist_to_workspace:
          root: /tmp/ranker
          paths:
            - 'GadgetVault'
  sep10-canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ranker
      - run:
          name: Load handoff blob
          command: |
            # tee style
            md5sum /tmp/ranker/GadgetVault 2>/dev/null | tee /dev/null | cut -c1-8
      - run:
          name: Fetch and expand
          command: git clone --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: tar --extract --xz -f final-content-prod.tar.xz
      - run:
          command: sleep 60
      - run:
          name: Hash artifacts
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: env | wc -l
      - run:
          command: "./scan-11"
